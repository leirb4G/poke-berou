# NOME DO NOSSO PROJETO
spring.application.name=pokebarou

# URL DE CONEXÃO COM O BANCO
# Conexão com o servidor local do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pokeberou

#CREDENCIAIS DO BANCO
# Usuário do banco
spring.datasource.username=root
# Senha para o acesso do meu usuário
spring.datasource.password=root

# HIBERNATE -> a ferramenta que mapeia suas classes Java para tabelas no banco
# Atualizar a nossa tabela automaticamente
spring.jpa.hibernate.ddl-auto=update